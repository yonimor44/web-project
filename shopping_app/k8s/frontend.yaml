apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-frontend
  template:
    metadata:
      labels:
        app: shopping-frontend
    spec:
      containers:
      - name: shopping-frontend
        image: localhost:5000/shopping-frontend:999
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-frontend-service
spec:
  type: NodePort
  selector:
    app: shopping-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080