apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-backend-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: shopping-backend
  template:
    metadata:
      labels:
        app: shopping-backend
    spec:
      containers:
      - name: shopping-backend
        image: localhost:5000/shopping-backend:latest
        ports:
        - containerPort: 3000
        env:
          - name: JWT_SECRET
            value: "super-secret-jwt-key"
          - name: DB_HOST
            value: "localhost"
          - name: DB_PORT
            value: "5432"
          - name: DB_USERNAME
            value: "postgres"
          - name: DB_PASSWORD
            value: "postgres"
          - name: DB_NAME
            value: "shopping_db"
          - name: FRONTEND_URL
            value: "http://localhost:5173"
          - name: SESSION_SECRET
            value: "super-secret-session-key"
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5